[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-sepsis"
version = "0.1.0"
description = "Reproducible MIMIC-IV sepsis cohort and modelling utilities"
requires-python = ">=3.10"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
analysis = [
  "duckdb>=1.1,<2",
  "ipykernel>=6,<7",
  "jupyterlab>=4,<5",
  "matplotlib>=3.8,<4",
  "pandas>=2.1,<3",
  "scikit-learn>=1.8,<2",
]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
